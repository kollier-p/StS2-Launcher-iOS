name: Check native iOS JIT gate syntax

on:
  workflow_dispatch:
  push:
    branches: ["feature/steamkit2-integration"]
    paths:
      - "ios/jit/JitGate.mm"
      - "ios/jit/SteamSetupGate.mm"
      - "ios/jit/SceneLifecycle.mm"
      - "ios/Sts2Native.mm"
      - ".github/workflows/native-gate-syntax.yml"

permissions:
  contents: read

jobs:
  native:
    runs-on: xcode-27
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check UIKit scene + SteamKit2 first-launch Objective-C++ compilation
        shell: bash
        run: |
          set -euo pipefail
          sdk="$(xcrun --sdk iphoneos --show-sdk-path)"
          # Same relative include ordering as prepare_xcode.py's generated dummy.cpp.
          cat > native-check.mm <<'EOF'
          #include "ios/Sts2Native.mm"
          #include "ios/jit/JitGate.mm"
          #include "ios/jit/SteamSetupGate.mm"
          #include "ios/jit/SceneLifecycle.mm"
          EOF
          xcrun clang++ -x objective-c++ -std=c++17 -fobjc-arc -fblocks \
            -arch arm64 -miphoneos-version-min=16.0 -isysroot "$sdk" \
            -fsyntax-only native-check.mm
          rm native-check.mm
